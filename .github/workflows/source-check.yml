name: source-check

# Source Policy Registry only (robots.txt, VAT wording, event-date wording) — about a minute, no price scraping.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04      # fixed image (see pr-checks.yml)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape/sources.py
        env:
          PYTHONUTF8: "1"
      - name: Save
        run: |
          git config user.name "weekly-prices bot"
          git config user.email "actions@users.noreply.github.com"
          git add data2/sources.json
          git diff --cached --quiet || git commit -m "Source check $(date -u +%F)"
          git pull --rebase -X theirs origin main   # another run may have pushed meanwhile
          git push
