name: source-check

# Source Policy Registry only (robots.txt, VAT wording, event-date wording) — about a minute, no price scraping.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape/sources.py
        env:
          PYTHONUTF8: "1"
      - name: Save
        run: |
          git config user.name "weekly-prices bot"
          git config user.email "actions@users.noreply.github.com"
          git add data2/sources.json
          git diff --cached --quiet || git commit -m "Source check $(date -u +%F)"
          git pull --rebase -X theirs origin main   # another run may have pushed meanwhile
          git push
