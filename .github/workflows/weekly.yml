name: weekly-prices

on:
  schedule:
    - cron: "0 21 * * *"      # every day 06:00 KST: Monday = weekly update; other days only if saved events have
                              # expired (build2/needs_refresh.py), otherwise the run stops right away
  workflow_dispatch:           # "Run workflow" button for a manual update
    inputs:
      skip_scrape:
        description: "rebuild from saved data only, no scraping (price-check.yml starts this after a source re-check)"
        type: boolean
        default: false
  push:                        # app or build code changed: rebuild from saved data and redeploy (no scraping)
    branches: [main]
    paths: ["app/**", "build2/**", "tests/**", "knowledge/**", ".github/workflows/weekly.yml"]   # knowledge/ = 시술 설명

permissions: {}       # nothing by default; each job asks only for what it needs (least privilege)

concurrency:
  group: weekly-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # commit the new data
    timeout-minutes: 90
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Decide
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python build2/needs_refresh.py; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.decide.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Unit tests (price calculation, comparison keys, treatment taxonomy, knowledge base) + secret scan
        if: steps.decide.outputs.run == 'true'
        run: |
          node --test tests/*.test.js
          python build2/xkeys.py
          python build2/taxonomy.py
          python build2/knowledge.py
          python tests/security/scan_secrets.py
      - name: Scrape, check, build
        if: steps.decide.outputs.run == 'true'
        run: python build2/weekly.py ${{ (github.event_name == 'push' || inputs.skip_scrape) && '--skip-scrape' || '' }}
        env:
          PYTHONUTF8: "1"
      - name: Save accepted data, snapshots and report
        if: steps.decide.outputs.run == 'true'
        run: |
          git config user.name "weekly-prices bot"
          git config user.email "actions@users.noreply.github.com"
          git add data2/accepted data2/history data2/geocache.json data2/branches.csv data2/issues.csv data2/report.md app/data.json
          for f in data2/sources.json data2/review.csv; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "${{ (github.event_name == 'push' || inputs.skip_scrape) && 'Rebuild app data' || 'Weekly prices' }} $(date -u +%F)"
          git pull --rebase -X theirs origin main   # another run may have pushed meanwhile
          git push
      - name: Summary
        if: steps.decide.outputs.run == 'true'
        run: cat data2/report.md >> "$GITHUB_STEP_SUMMARY"
      - if: steps.decide.outputs.run == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: app
  deploy:
    needs: update
    if: needs.update.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write       # publish to GitHub Pages
      id-token: write    # Pages deployment identity
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
