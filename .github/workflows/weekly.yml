name: weekly-prices

on:
  schedule:
    - cron: "0 21 * * *"      # every day 06:00 KST: Monday = weekly update; other days only if saved events have
                              # expired (build2/needs_refresh.py), otherwise the run stops right away
  workflow_dispatch:           # "Run workflow" button for a manual update
    inputs:
      skip_scrape:
        description: "rebuild from saved data only, no scraping (price-check.yml starts this after a source re-check)"
        type: boolean
        default: false
  push:                        # app or build code changed: rebuild from saved data and redeploy (no scraping)
    branches: [main]
    paths: ["app/**", "build2/**", "tests/**", "knowledge/**", ".github/workflows/weekly.yml"]   # knowledge/ = 시술 설명

permissions: {}       # nothing by default; each job asks only for what it needs (least privilege)

concurrency:
  group: weekly-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # commit the new data
    timeout-minutes: 90
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # The whole factory run is tools/factory.sh — the same script the Cloudflare factory box runs (cf/factory,
      # docs/CLOUDFLARE_MIGRATION.md): decide (schedule only) → unit tests + secret scan → scrape/build → review queue →
      # save to main → deploy app/ to Cloudflare when the token is set (the script hides the token from the build steps).
      - name: Factory (decide, test, scrape/build, save, deploy to Cloudflare)
        id: decide
        run: bash tools/factory.sh "$FACTORY_MODE"
        env:
          FACTORY_MODE: ${{ github.event_name == 'schedule' && 'weekly' || ((github.event_name == 'push' || inputs.skip_scrape) && 'rebuild' || 'scrape') }}
          FACTORY_INSTALL: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Summary
        if: steps.decide.outputs.run == 'true'
        run: cat data2/report.md >> "$GITHUB_STEP_SUMMARY"
      # GitHub Pages deploy removed 2026-10-15: the repository is private now (free plan: no Pages), the app lives only on
      # Cloudflare (factory.sh → wrangler deploy). Without the deploy token the run fails here instead of silently not deploying.
      - name: Check the app was deployed to Cloudflare
        if: steps.decide.outputs.run == 'true'
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then echo "::error title=Cloudflare::CLOUDFLARE_API_TOKEN secret missing — the app was not deployed anywhere"; exit 1; fi
