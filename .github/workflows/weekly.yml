name: weekly-prices

on:
  schedule:
    - cron: "0 21 * * 0"      # every Monday 06:00 KST (Sunday 21:00 UTC)
  workflow_dispatch: {}        # "Run workflow" button for a manual update

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scrape, check, build
        run: python build2/weekly.py
        env:
          PYTHONUTF8: "1"
      - name: Save accepted data, snapshots and report
        run: |
          git config user.name "weekly-prices bot"
          git config user.email "actions@users.noreply.github.com"
          git add data2/accepted data2/history data2/geocache.json data2/branches.csv data2/issues.csv data2/report.md app/data.json
          git diff --cached --quiet || git commit -m "Weekly prices $(date -u +%F)"
          git push
      - name: Summary
        run: cat data2/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
