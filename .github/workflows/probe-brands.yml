# Probe candidate clinic chains (scrape/probe.py) on a GitHub runner — the dev container cannot reach clinic sites.
# Runs only on pushes to probe/** branches: it never commits, never deploys, holds no secrets, and only uploads what it
# read (robots.txt answers + sample public price pages) as a short-lived artifact for a person to review.
name: probe brands
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
concurrency:
  group: probe-brands
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Probe (robots.txt first, 1 request/s per host, at most 40 pages per brand)
        working-directory: scrape
        env:
          PROBE_OUT: ${{ github.workspace }}/probe_out
        run: python probe.py
      - name: Run collectors in dry mode when present (raw CSV only, nothing committed)
        if: hashFiles('scrape/probe_collect.txt') != ''
        working-directory: scrape
        run: |
          mkdir -p ../probe_out/raw
          while read -r m; do [ -n "$m" ] && python "$m.py" && cp ../data2/raw/"$m".csv ../data2/raw/"$m".log.json ../probe_out/raw/ || echo "collector $m failed"; done < probe_collect.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: probe-out
          path: probe_out
          retention-days: 7
