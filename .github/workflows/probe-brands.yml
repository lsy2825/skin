# Probe candidate clinic chains on a GitHub runner — the dev container cannot reach clinic sites.
# Runs only on pushes to probe/** branches: read-only token, no commit, no deploy, no secrets. What it read comes back as
# run annotations (scrape/probe_report.py), because artifact and log downloads are blocked from the dev container.
# Each matrix entry is one job (annotations are capped per job):
#   probe:<brand>      robots.txt + sample pages (scrape/probe.py)
#   raw:all:0          scrape/raw_probe.py — pages as fetched (scripts kept) + same-site script files (RAW_URLS)
#   addr:all:0         scrape/addr_probe.py — branch pages for the branches with no address (robots.txt first)
#   collect:<key>:i/n  run collector scrape/<key>.py on every n-th branch from i; its raw CSV + log come back
# Probe branches are deleted after review.
name: probe brands
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
concurrency:
  group: probe-brands
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        task: ["addr:all:0", "raw:all:0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run the task (robots.txt first for probes; collectors keep 1 request/s per site)
        working-directory: scrape
        env:
          TASK: ${{ matrix.task }}
          PROBE_OUT: ${{ github.workspace }}/probe_out
          PROBE_MAX: "25"
          ADDR_SITES: "유앤아이|목포점,유앤아이|화성봉담점"
          DEEP: "1"
          RAW_URLS: "https://www.cellinclinic13.com/clinicPrice/clinicListLeft.php,https://www.cellinclinic10.com/clinicPriceSide/clinicSideList.php,https://www.cellinclinic01.com/"
          RAW_FOLLOW: "1"
        run: |
          mkdir -p "$PROBE_OUT/raw"
          IFS=: read -r kind key shard <<< "$TASK"
          if [ "$kind" = probe ]; then python probe.py "$key"
          elif [ "$kind" = addr ]; then python addr_probe.py || echo "address probe failed"
          elif [ "$kind" = raw ]; then python raw_probe.py || echo "raw probe failed"; else
            python "$key.py" --shard "$shard" --workers 4 || echo "collector $key $shard failed"
            i="${shard%/*}"
            cp ../data2/raw/"$key".csv "$PROBE_OUT/raw/$key.$i.csv" 2>/dev/null || true
            cp ../data2/raw/"$key".log.json "$PROBE_OUT/raw/$key.$i.log.json" 2>/dev/null || true
            python branch_rows.py "$key" "$PROBE_OUT/raw/$key.$i.branches.csv" || echo "branch addresses $key $shard failed"
          fi
      - name: Pack the output
        run: python scrape/probe_report.py split probe_out probe_chunks
      - name: Send pieces 0-9
        run: python scrape/probe_report.py emit probe_chunks 0
      - name: Send pieces 10-19
        run: python scrape/probe_report.py emit probe_chunks 10
      - name: Send pieces 20-29
        run: python scrape/probe_report.py emit probe_chunks 20
      - name: Send pieces 30-39
        run: python scrape/probe_report.py emit probe_chunks 30
      - name: Send pieces 40-49
        run: python scrape/probe_report.py emit probe_chunks 40
