# Probe candidate clinic chains (scrape/probe.py) on a GitHub runner — the dev container cannot reach clinic sites.
# Runs only on pushes to probe/** branches: it never deploys and holds no secrets. What it read (robots.txt answers +
# sample public price pages) is committed back to THAT probe branch only (artifact downloads are blocked from the dev
# container), with [skip ci] in the message so that push does not start it again. Probe branches are deleted
# after review; main is never touched.
name: probe brands
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: write   # only to commit probe_out/ back to the probe branch that triggered this run
concurrency:
  group: probe-brands
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Probe (robots.txt first, 1 request/s per host, at most 40 pages per brand)
        working-directory: scrape
        env:
          PROBE_OUT: ${{ github.workspace }}/probe_out
        run: python probe.py
      - name: Run listed collectors when present (raw CSV copied into probe_out only)
        if: hashFiles('scrape/probe_collect.txt') != ''
        working-directory: scrape
        run: |
          mkdir -p ../probe_out/raw
          while read -r m; do [ -n "$m" ] && python "$m.py" && cp ../data2/raw/"$m".csv ../data2/raw/"$m".log.json ../probe_out/raw/ || echo "collector $m failed"; done < probe_collect.txt
      - name: Commit the probe output to this probe branch only
        if: startsWith(github.ref_name, 'probe/')
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add -f probe_out
          git commit -q -m "probe output ${{ github.run_id }} [skip ci]" || exit 0
          git push origin "HEAD:refs/heads/${{ github.ref_name }}"
