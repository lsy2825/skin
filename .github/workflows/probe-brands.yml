# Probe candidate clinic chains (scrape/probe.py) on a GitHub runner — the dev container cannot reach clinic sites.
# Runs only on pushes to probe/** branches: read-only token, no commit, no deploy, no secrets. What it read (robots.txt
# answers + lean copies of sample public price pages) comes back as run annotations (scrape/probe_report.py), because
# artifact and log downloads are blocked from the dev container. Probe branches are deleted after review.
name: probe brands
on:
  push:
    branches: ["probe/**"]
permissions:
  contents: read
concurrency:
  group: probe-brands
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        brand: [daybeau, uandi, vands, drevers, cellin]   # one job each: annotations are capped per job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Probe (robots.txt first, 1 request/s per host, at most 25 pages per brand)
        working-directory: scrape
        env:
          PROBE_OUT: ${{ github.workspace }}/probe_out
          PROBE_MAX: "25"
        run: python probe.py ${{ matrix.brand }}
      - name: Run listed collectors when present (raw CSV copied into probe_out only)
        if: hashFiles('scrape/probe_collect.txt') != ''
        working-directory: scrape
        run: |
          mkdir -p ../probe_out/raw
          while read -r m; do [ -n "$m" ] && python "$m.py" && cp ../data2/raw/"$m".csv ../data2/raw/"$m".log.json ../probe_out/raw/ || echo "collector $m failed"; done < probe_collect.txt
      - name: Pack the output
        run: python scrape/probe_report.py split probe_out probe_chunks
      - name: Send pieces 0-9
        run: python scrape/probe_report.py emit probe_chunks 0
      - name: Send pieces 10-19
        run: python scrape/probe_report.py emit probe_chunks 10
      - name: Send pieces 20-29
        run: python scrape/probe_report.py emit probe_chunks 20
      - name: Send pieces 30-39
        run: python scrape/probe_report.py emit probe_chunks 30
      - name: Send pieces 40-49
        run: python scrape/probe_report.py emit probe_chunks 40
