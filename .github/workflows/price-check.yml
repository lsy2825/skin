name: price-check

# Re-read the source pages of unusually low prices (scrape/verify_prices.py), save the results, then start a rebuild
# without scraping (weekly.yml, skip_scrape) so the app shows them: a price found again on its page counts as checked.
on:
  workflow_dispatch:
    inputs:
      max:
        description: "how many low prices to check"
        default: "40"

permissions:
  contents: write
  actions: write     # start the rebuild (weekly.yml)

concurrency:
  group: weekly-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scrape/verify_prices.py --max "${{ github.event.inputs.max || '40' }}"
        env:
          PYTHONUTF8: "1"
      - name: Save
        run: |
          git config user.name "weekly-prices bot"
          git config user.email "actions@users.noreply.github.com"
          git add data2/price_checks.csv data2/price_checks.md
          git diff --cached --quiet || git commit -m "Price check $(date -u +%F)"
          git pull --rebase -X theirs origin main   # another run may have pushed meanwhile
          git push
      - name: Rebuild the app with the results (no scraping)
        run: gh workflow run weekly.yml --ref main -f skip_scrape=true
        env:
          GH_TOKEN: ${{ github.token }}
