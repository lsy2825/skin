name: price-check

# Re-read the source pages of unusually low prices (scrape/verify_prices.py), save the results, then start a rebuild
# without scraping (weekly.yml, skip_scrape) so the app shows them: a price found again on its page counts as checked.
on:
  workflow_dispatch:
    inputs:
      max:
        description: "how many low prices to check (1-200)"
        type: number
        default: 40

permissions:
  contents: write
  actions: write     # start the rebuild (weekly.yml)

concurrency:
  group: weekly-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # the input reaches the shell only as an environment variable and is checked to be a number 1-200
      - run: |
          case "$MAX" in ''|*[!0-9]*) echo "max must be a number"; exit 1;; esac
          if [ "$MAX" -lt 1 ] || [ "$MAX" -gt 200 ]; then echo "max must be 1-200"; exit 1; fi
          python scrape/verify_prices.py --max "$MAX"
        env:
          MAX: ${{ inputs.max || 40 }}
          PYTHONUTF8: "1"
      - name: Save
        run: |
          git config user.name "weekly-prices bot"
          git config user.email "actions@users.noreply.github.com"
          git add data2/price_checks.csv data2/price_checks.md
          git diff --cached --quiet || git commit -m "Price check $(date -u +%F)"
          git pull --rebase -X theirs origin main   # another run may have pushed meanwhile
          git push
      - name: Rebuild the app with the results (no scraping)
        run: gh workflow run weekly.yml --ref main -f skip_scrape=true
        env:
          GH_TOKEN: ${{ github.token }}
