name: cf-workers

# Deploys the metrics Worker (cf/metrics, A4) when its code changes on main, or by the "Run workflow" button.
# Order: unit tests → D1 migrations → deploy. A failed step stops the run, so a migration failure never ships new code.
# Skips with a notice (not an error) until it can deploy completely: the D1 database_id is filled in cf/metrics/wrangler.jsonc
# and the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets exist. The app (app/) is deployed by weekly.yml, not here.
on:
  push:
    branches: [main]
    paths: ["cf/metrics/**", ".github/workflows/cf-workers.yml"]
  workflow_dispatch:

permissions: {}       # nothing by default; the job asks only for what it needs

concurrency:
  group: cf-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Unit tests (stages, privacy, Access)
        run: node --test cf/metrics/test/*.test.mjs
      - name: Ready to deploy?
        id: ready
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ (secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID) != '' }}
        run: |
          if grep -q 'REPLACE_WITH_D1_ID' cf/metrics/wrangler.jsonc; then
            echo "::notice title=metrics not deployed::database_id in cf/metrics/wrangler.jsonc is still the placeholder (create the D1 database first)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::notice title=metrics not deployed::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      # Install wrangler (and its install scripts) in a step WITHOUT the token; the steps below then run that copy offline-first.
      - name: Install wrangler (no secrets in this step)
        if: steps.ready.outputs.go == 'true'
        run: npm install --no-save --no-fund --no-audit --prefix "$RUNNER_TEMP/wr" wrangler@4.145.0
      - name: Apply D1 migrations
        if: steps.ready.outputs.go == 'true'
        run: '"$RUNNER_TEMP/wr/node_modules/.bin/wrangler" d1 migrations apply yoonsiljang-metrics --remote --config cf/metrics/wrangler.jsonc'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
      - name: Deploy
        if: steps.ready.outputs.go == 'true'
        run: '"$RUNNER_TEMP/wr/node_modules/.bin/wrangler" deploy --config cf/metrics/wrangler.jsonc'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
