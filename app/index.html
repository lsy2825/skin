<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>피부과 가격비교</title>
<meta name="description" content="공장형 피부과 브랜드·지점별 시술 가격 비교">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="vendor/fonts/NanumSquareRoundB.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
/* 나눔스퀘어라운드 (OFL, vendor/fonts). Weights: R 300–500, B 600–700, EB 800–900 */
@font-face { font-family: "NanumSquareRound"; src: url(vendor/fonts/NanumSquareRoundR.woff2) format("woff2"); font-weight: 300 500; font-display: swap; }
@font-face { font-family: "NanumSquareRound"; src: url(vendor/fonts/NanumSquareRoundB.woff2) format("woff2"); font-weight: 600 700; font-display: swap; }
@font-face { font-family: "NanumSquareRound"; src: url(vendor/fonts/NanumSquareRoundEB.woff2) format("woff2"); font-weight: 800 900; font-display: swap; }
:root {
  --bg: #f2f4f6; --surface: #fff; --fill: #f2f4f6; --sunken: #f7f8fa; --line: #e5e8eb; --line-soft: #f0f2f5;
  --ink: #191f28; --ink-2: #4e5968; --muted: #6b7684; --faint: #b0b8c1;
  --accent: #1b64da; --accent-fill: #3182f6; --accent-soft: #e8f3ff; --accent-ink: #fff;
  --good: #1b64da; --pricey: #e42939; --pricey-soft: #ffeef0;
  --k-trial-bg: #e8f3ff; --k-trial: #1b64da; --k-ltd-bg: #fff1e0; --k-ltd: #b05200; --k-post-bg: #f0f2f5; --k-post: #4e5968;
  --tag-bg: #fff6d9; --tag: #7a5600;
  --shadow: 0 1px 2px rgba(25,31,40,.04), 0 10px 28px rgba(25,31,40,.08);
  --s1: #2a78d6; --s2: #eb6834;
  --r: 20px; --nav-h: 64px;
  --font: "NanumSquareRound", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1114; --surface: #191b20; --fill: #24272e; --sunken: #20232a; --line: #2b2f37; --line-soft: #22252c;
  --ink: #f2f4f6; --ink-2: #c9ced6; --muted: #9aa2ad; --faint: #5d6570;
  --accent: #6eaaff; --accent-fill: #3182f6; --accent-soft: #15284a; --good: #6eaaff; --pricey: #ff6b78; --pricey-soft: #3a1b20;
  --k-trial-bg: #15284a; --k-trial: #8fbdff; --k-ltd-bg: #3a2710; --k-ltd: #ffb866; --k-post-bg: #262a31; --k-post: #c9ced6;
  --tag-bg: #352b0e; --tag: #f2d583; --shadow: 0 0 0 1px #2b2f37; --s1: #3987e5; --s2: #d95926; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1114; --surface: #191b20; --fill: #24272e; --sunken: #20232a; --line: #2b2f37; --line-soft: #22252c;
  --ink: #f2f4f6; --ink-2: #c9ced6; --muted: #9aa2ad; --faint: #5d6570;
  --accent: #6eaaff; --accent-fill: #3182f6; --accent-soft: #15284a; --good: #6eaaff; --pricey: #ff6b78; --pricey-soft: #3a1b20;
  --k-trial-bg: #15284a; --k-trial: #8fbdff; --k-ltd-bg: #3a2710; --k-ltd: #ffb866; --k-post-bg: #262a31; --k-post: #c9ced6;
  --tag-bg: #352b0e; --tag: #f2d583; --shadow: 0 0 0 1px #2b2f37; --s1: #3987e5; --s2: #d95926; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; letter-spacing: -0.01em;
  word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent-fill); outline-offset: 2px; }
a { color: var(--accent); }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 860px; margin: 0 auto; padding: 14px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) { .wrap { padding-bottom: 48px; } }

/* header */
header.top { display: flex; align-items: center; gap: 10px; padding: 6px 0 12px; }
.logo { width: 32px; height: 32px; border-radius: 10px; background: var(--accent-fill); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
header.top h1 { font-size: 18px; font-weight: 800; margin: 0; letter-spacing: -0.03em; }
header.top .upd { font-size: 12px; color: var(--muted); }
.regbtn { margin-left: auto; }
.regbtn + .locbtn { margin-left: 0; }
.locbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 8px 12px; font-size: 13px; font-weight: 600; max-width: 46vw; }
.locbtn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; }
.locbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.locbtn.on { color: var(--accent); background: var(--accent-soft); }

/* bottom nav (phone) / top tabs (wide) */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--surface); border-top: 1px solid var(--line-soft);
  display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); border-radius: 20px 20px 0 0; box-shadow: 0 -8px 24px rgba(25,31,40,.06); }
nav.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 600; color: var(--faint); position: relative; }
nav.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current="page"] { color: var(--ink); }
nav.tabs .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--accent-fill); color: #fff; font-size: 10.5px; line-height: 17px; padding: 0 4px; }
@media (min-width: 900px) {
  nav.tabs { position: sticky; top: 0; bottom: auto; border-radius: 0; box-shadow: none; border: 0; border-bottom: 1px solid var(--line); background: var(--bg);
    display: flex; justify-content: center; gap: 4px; padding: 8px; }
  nav.tabs button { flex-direction: row; gap: 8px; font-size: 14.5px; padding: 8px 16px; border-radius: 12px; color: var(--ink-2); }
  nav.tabs svg { width: 18px; height: 18px; }
  nav.tabs button[aria-current="page"] { background: var(--surface); }
  nav.tabs .badge { position: static; }
}

/* shared */
.view { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; animation: fadein .25s ease both; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card { background: var(--surface); border-radius: var(--r); padding: 18px; min-width: 0; }
.card.flush { padding: 6px; }
h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; margin: 0; line-height: 1.3; }
h3 { font-size: 16px; font-weight: 700; margin: 0; }
.sub { font-size: 13px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sp { flex: 1; }
.search { display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 16px; padding: 4px 6px 4px 16px; box-shadow: var(--shadow); }
.search svg { width: 20px; height: 20px; flex: none; fill: none; stroke: var(--accent-fill); stroke-width: 2.4; stroke-linecap: round; }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 12px 0; font-size: 16px; outline: none; }
.search button { border: 0; background: var(--fill); border-radius: 12px; padding: 8px 12px; font-weight: 600; font-size: 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.card .chip { background: var(--fill); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .tr { width: 40px; height: 24px; border-radius: 12px; background: var(--faint); position: relative; flex: none; transition: background .2s; }
.switch .tr::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch input:checked + .tr { background: var(--accent-fill); }
.switch input:checked + .tr::after { transform: translateX(16px); }
.switch input:focus-visible + .tr { outline: 2px solid var(--accent-fill); outline-offset: 2px; }
.btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 700; background: var(--accent-fill); color: #fff; }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.gray { background: var(--fill); color: var(--ink-2); }
.btn.sm { padding: 8px 12px; font-size: 13.5px; border-radius: 12px; }
.empty { padding: 28px 8px; text-align: center; color: var(--muted); font-size: 14px; }
.k { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; white-space: nowrap; vertical-align: 1px; }
.k1 { background: var(--k-trial-bg); color: var(--k-trial); }
.k2 { background: var(--k-ltd-bg); color: var(--k-ltd); }
.k4 { background: var(--k-post-bg); color: var(--k-post); }
.kt { background: var(--tag-bg); color: var(--tag); }
.kx { background: var(--pricey-soft); color: var(--pricey); }
a.src { font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
.bdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
s { color: var(--muted); font-size: 12.5px; }

/* lists */
.list { list-style: none; margin: 0; padding: 0; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 12px; border-radius: 14px; }
button.item:hover { background: var(--sunken); }
button.item:active { background: var(--fill); }
.item + .item, li + li > .item { border-top: 1px solid var(--line-soft); }
.item .t { font-weight: 600; line-height: 1.4; min-width: 0; }
.item .p { font-weight: 800; font-size: 16px; text-align: right; white-space: nowrap; }
.item .m { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--muted); }
.rank { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; width: 100%; text-align: left; border: 0; background: none; padding: 12px 10px; border-radius: 14px; }
.rank:hover { background: var(--sunken); }
.rank .n { font-weight: 800; color: var(--faint); text-align: center; }
.rank.top .n { color: var(--accent); }
.rank .b { font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; }
.rank .b span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .p { font-weight: 800; font-size: 16px; text-align: right; white-space: nowrap; }
.rank .m { grid-column: 2 / -1; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
li + li > .rank { border-top: 1px solid var(--line-soft); }

/* home cards */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.pc { display: grid; gap: 2px; text-align: left; border: 0; background: var(--surface); border-radius: 18px; padding: 16px; min-width: 0; transition: transform .12s; }
.pc:active { transform: scale(.97); }
.pc .c { font-size: 12px; font-weight: 700; color: var(--accent); }
.pc .l { font-size: 14px; font-weight: 600; color: var(--ink-2); line-height: 1.35; min-height: 2.7em; }
.pc .p { font-size: 21px; font-weight: 800; letter-spacing: -0.03em; margin-top: 4px; white-space: nowrap; }
.pc .w { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* compare head */
.keyhead { display: grid; gap: 6px; }
.keyhead .label { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 2px 12px; background: var(--accent-soft); border-radius: 16px; padding: 14px 16px; }
.hero .hl { grid-column: 1 / -1; font-size: 12.5px; font-weight: 700; color: var(--accent); }
.hero .hb { font-weight: 700; }
.hero .hp { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; white-space: nowrap; }
select.pick { width: 100%; border: 0; background: var(--fill); border-radius: 12px; padding: 12px 14px; font-weight: 600; }

/* map */
#map { height: min(58vh, 520px); border-radius: var(--r); overflow: hidden; background: var(--fill); z-index: 0; }
.leaflet-container { font-family: var(--font); }
.pin-price { background: var(--surface); color: var(--ink); border: 2px solid var(--c, #3182f6); border-radius: 10px; padding: 1px 6px; font-size: 12px; font-weight: 800; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,.2); transform: translate(-50%, -50%); display: inline-block; }
.pin-price.best { background: var(--c, #3182f6); color: #fff; }
.me { width: 16px; height: 16px; border-radius: 50%; background: #3182f6; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(49,130,246,.25); }
.leaflet-popup-content { margin: 12px 14px; font-size: 14px; }
.leaflet-popup-content b { font-size: 15px; }

/* cart */
.qty { display: inline-flex; align-items: center; gap: 4px; background: var(--fill); border-radius: 12px; padding: 2px; }
.qty button { width: 30px; height: 30px; border: 0; border-radius: 10px; background: var(--surface); font-weight: 800; }
.qty b { min-width: 22px; text-align: center; }
.addbtn { border: 0; border-radius: 12px; padding: 8px 12px; font-size: 13.5px; font-weight: 700; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.addbtn[aria-pressed="true"] { background: var(--accent-fill); color: #fff; }
.hero.alt { background: var(--fill); }
.hero.alt .hl { color: var(--ink-2); }
select.mini { border: 0; background: var(--fill); border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 600; max-width: 100%; color: var(--ink); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.opt { display: grid; gap: 2px; text-align: left; border: 2px solid transparent; background: var(--fill); border-radius: 14px; padding: 10px 12px; }
.opt b { font-size: 14px; }
.opt span { font-size: 12.5px; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent-fill); background: var(--accent-soft); }
.opt[aria-pressed="true"] span { color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border-radius: 16px; padding: 4px; }
.seg button { border: 0; background: none; border-radius: 12px; padding: 10px 4px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.seg.seg4 { grid-template-columns: repeat(3, 1fr); }
.seg.seg4 button { font-size: 12.5px; padding: 9px 2px; }
.chev { margin-left: auto; color: var(--accent); font-weight: 700; }
.qrow.open > .rank { background: var(--sunken); border-radius: 14px 14px 0 0; }
.qbody { background: var(--sunken); border-radius: 0 0 14px 14px; padding: 4px 12px 14px; }
.qline { padding: 10px 0; border-bottom: 1px solid var(--line); }
.qline .m { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.sheet-bg { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; animation: fadein .2s ease both; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 86vh; overflow: auto; border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) { .sheet-bg { align-items: center; } .sheet { border-radius: 22px; } }
/* rank / versus / branch level */
.dbar { position: relative; display: inline-block; width: 90px; height: 8px; flex: none; }
.dbar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line); }
.dbar i { position: absolute; top: 0; height: 8px; }
.dbar i.neg { background: var(--good); border-radius: 4px 0 0 4px; }
.dbar i.pos { background: var(--pricey); border-radius: 0 4px 4px 0; }
.rank .p.down, .rank .p.up { font-size: 15px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: var(--fill); border-radius: 14px; padding: 12px; display: grid; gap: 2px; min-width: 0; }
.tile .k { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.tile b { font-size: 18px; font-weight: 800; }
.tile .w { font-size: 12px; color: var(--muted); }
.vpick { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: end; }
@media (max-width: 560px) { .vpick { grid-template-columns: minmax(0, 1fr); } .swap { justify-self: center; } }
.swap { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--fill); font-size: 20px; font-weight: 800; color: var(--ink-2); }
.vsum { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.35; }
.vbar { display: flex; gap: 2px; height: 14px; margin-top: 12px; }
.vbar i { display: block; min-width: 3px; border-radius: 4px; }
/* 내정보 */
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 22px; font-weight: 800; flex: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.stats div { background: var(--fill); border-radius: 14px; padding: 10px; display: grid; gap: 2px; text-align: center; }
.stats b { font-size: 18px; font-weight: 800; }
.stats span { font-size: 12px; color: var(--muted); }
.flabel { display: grid; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink-2); margin-top: 12px; }
.field { width: 100%; border: 0; background: var(--fill); border-radius: 12px; padding: 12px 14px; font-size: 16px; color: var(--ink); }
textarea.field { resize: vertical; font-family: inherit; }
.chips.wrapc { flex-wrap: wrap; margin: 0; padding: 0; overflow: visible; }
.login-kakao { background: #fee500; color: #191919; }
.login-google { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
details.fold > summary { cursor: pointer; padding: 12px; font-weight: 700; list-style: none; }
details.fold > summary::after { content: " ▼"; color: var(--muted); font-size: 12px; }
details.fold[open] > summary::after { content: " ▲"; }
/* trend charts */
.down { color: var(--good); font-weight: 700; }
.up { color: var(--pricey); font-weight: 700; }
.spark path { fill: none; stroke: var(--s1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.lc { margin-top: 8px; }
.lcbox { position: relative; }
.lcsvg { width: 100%; height: auto; display: block; overflow: visible; }
.lcsvg .grid { stroke: var(--line-soft); stroke-width: 1; }
.lcsvg .ax { fill: var(--muted); font-size: 11px; }
.lcsvg .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.lcsvg .mk { stroke: var(--surface); stroke-width: 2; }
.lcsvg .dl { fill: var(--ink-2); font-size: 11px; font-weight: 700; }
.lcsvg .hair { stroke: var(--faint); stroke-width: 1; }
.lcsvg rect:focus { outline: none; }
